name: Deploy

# 只负责部署：构建 + 上传 Worker。
# 先部署新 Worker、再跑 D1 迁移：新 Worker 必须能容忍旧表结构（例如已删除的列
# 不再出现在 SELECT 里），这样迁移失败或稍晚执行时线上不会直接 500。
# 触发链：push main → Deploy → Database Migrate。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          KV_SETTINGS_ID: ${{ secrets.CLOUDFLARE_KV_SETTINGS_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_D1_DATABASE_ID（Cloudflare D1 的 database_id）。请到仓库 Settings → Secrets and variables → Actions → Secrets 配置后重新运行。"
            exit 1
          fi
          if [ -z "$KV_SETTINGS_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_KV_SETTINGS_ID（站点设置用的 KV namespace id）。见 docs/DEPLOY.md 第 2.3 节：pnpm exec wrangler kv namespace create myon-blog-settings，然后把 id 配成 Repository Secret。"
            exit 1
          fi
      - name: Generate wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          KV_SETTINGS_ID: ${{ secrets.CLOUDFLARE_KV_SETTINGS_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: production
        run: pnpm wrangler:config
      # Worker 的“Preview URL”（<version>-myon-blog.<workers.dev>）会公开暴露每个版本，
      # 且不经过自定义域名与 Cloudflare Access；部署前强制关闭，避免线上出现绕过入口。
      - name: Disable Worker preview URLs
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const configPath = 'apps/web/wrangler.jsonc';
          // 生成文件是 JSONC（保留模板里的 // 整行注释），先按生成脚本同样规则去注释再解析。
          const raw = fs.readFileSync(configPath, 'utf8');
          const cleaned = raw
            .split(/\r?\n/)
            .filter((line) => !/^\s*\/\//.test(line))
            .join('\n');
          const config = JSON.parse(cleaned);
          config.preview_urls = false;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          console.log('✓ preview_urls=false：本次部署不生成 Workers 版本 Preview URL');
          JS
      - name: Build
        run: pnpm build
      - name: Prepare Worker secrets file
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          BANGUMI_USERNAME: ${{ secrets.BANGUMI_USERNAME }}
          IMG2WEBP_TOKEN: ${{ secrets.IMG2WEBP_TOKEN }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');

          const names = [
            'ADMIN_TOKEN',
            'ACCESS_TEAM_DOMAIN',
            'ACCESS_AUD',
            'BANGUMI_ACCESS_TOKEN',
            'BANGUMI_USERNAME',
            'IMG2WEBP_TOKEN',
          ];

          const secrets = {};
          for (const name of names) {
            const value = process.env[name] ?? '';
            if (value === '') {
              console.log(`· 跳过 ${name}（Repository Secret 未配置）`);
              continue;
            }
            secrets[name] = value;
          }

          const file = path.join(process.env.RUNNER_TEMP, 'worker-secrets.json');
          fs.writeFileSync(file, JSON.stringify(secrets), { mode: 0o600 });
          console.log(`✓ 已准备 ${Object.keys(secrets).length} 个 Worker secret（值不会打印）`);
          JS
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
