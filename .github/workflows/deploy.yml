name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: D1 migrate · Deploy Worker · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_D1_DATABASE_ID（Cloudflare D1 的 database_id）。请到仓库 Settings → Secrets and variables → Actions → Secrets 配置后重新运行。"
            exit 1
          fi
      - name: Generate wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: production
        run: pnpm wrangler:config
      - name: Build
        run: pnpm build
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply myon-blog --remote
      - name: Prepare Worker secrets file
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          BANGUMI_USERNAME: ${{ secrets.BANGUMI_USERNAME }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');

          const names = [
            'ADMIN_TOKEN',
            'ACCESS_TEAM_DOMAIN',
            'ACCESS_AUD',
            'BANGUMI_ACCESS_TOKEN',
            'BANGUMI_USERNAME',
          ];

          const secrets = {};
          for (const name of names) {
            const value = process.env[name] ?? '';
            if (value === '') {
              console.log(`· 跳过 ${name}（Repository Secret 未配置）`);
              continue;
            }
            secrets[name] = value;
          }

          const file = path.join(process.env.RUNNER_TEMP, 'worker-secrets.json');
          fs.writeFileSync(file, JSON.stringify(secrets), { mode: 0o600 });
          console.log(`✓ 已准备 ${Object.keys(secrets).length} 个 Worker secret（值不会打印）`);
          JS
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          base="${SMOKE_URL:-${PRODUCTION_URL:-}}"
          if [ -z "$base" ]; then
            echo '· 未配置 PRODUCTION_URL / SMOKE_URL，跳过 smoke test'
            exit 0
          fi
          url="${base%/}/api/health"
          echo "health check → $url"

          curl_args=(--silent --show-error --max-time 20 --retry 2 --retry-delay 2)
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            curl_args+=(
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
            )
            echo '· 已带上 Cloudflare Access Service Token'
          fi

          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file"' EXIT

          code="$(curl "${curl_args[@]}" --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' "$url" || true)"

          if [ "$code" = "200" ]; then
            echo '✓ /api/health 返回 200'
            head -c 300 "$body_file"
            echo
            exit 0
          fi

          echo "✗ /api/health 返回 HTTP ${code:-curl 失败}"
          echo '--- 响应头（节选）---'
          grep -iE '^(server|cf-ray|cf-mitigated|cf-chl|location|content-type):' "$headers_file" || true
          echo '--- 响应体（前 300 字节）---'
          head -c 300 "$body_file" || true
          echo
          if grep -qiE 'cloudflare|just a moment|attention required|you have been blocked' "$headers_file" "$body_file"; then
            echo '::error::/api/health 被 Cloudflare 边缘拦截，不是 Worker 返回的错误。常见原因：WAF 自定义规则、Bot Fight Mode、Security Level、地区/ASN 限制拦截了 GitHub Actions 出口 IP；处理方式见 docs/DEPLOY.md 第 9 节。'
          else
            echo '::error::/api/health 非 200，请检查 Worker 部署与 D1 绑定。'
          fi
          exit 1
