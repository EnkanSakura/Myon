name: Deploy

# 只负责部署：构建 + 上传 Worker。
# D1 迁移在 Database Migrate workflow 里，健康检查在 Smoke Test workflow 里。
# 触发链：push main → Database Migrate → Deploy → Smoke Test。
on:
  workflow_run:
    workflows: [Database Migrate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          KV_SETTINGS_ID: ${{ secrets.CLOUDFLARE_KV_SETTINGS_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_D1_DATABASE_ID（Cloudflare D1 的 database_id）。请到仓库 Settings → Secrets and variables → Actions → Secrets 配置后重新运行。"
            exit 1
          fi
          if [ -z "$KV_SETTINGS_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_KV_SETTINGS_ID（站点设置用的 KV namespace id）。见 docs/DEPLOY.md 第 2.3 节：pnpm exec wrangler kv namespace create myon-blog-settings，然后把 id 配成 Repository Secret。"
            exit 1
          fi
      - name: Generate wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          KV_SETTINGS_ID: ${{ secrets.CLOUDFLARE_KV_SETTINGS_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: production
        run: pnpm wrangler:config
      - name: Build
        run: pnpm build
      - name: Prepare Worker secrets file
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          BANGUMI_USERNAME: ${{ secrets.BANGUMI_USERNAME }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');

          const names = [
            'ADMIN_TOKEN',
            'ACCESS_TEAM_DOMAIN',
            'ACCESS_AUD',
            'BANGUMI_ACCESS_TOKEN',
            'BANGUMI_USERNAME',
          ];

          const secrets = {};
          for (const name of names) {
            const value = process.env[name] ?? '';
            if (value === '') {
              console.log(`· 跳过 ${name}（Repository Secret 未配置）`);
              continue;
            }
            secrets[name] = value;
          }

          const file = path.join(process.env.RUNNER_TEMP, 'worker-secrets.json');
          fs.writeFileSync(file, JSON.stringify(secrets), { mode: 0o600 });
          console.log(`✓ 已准备 ${Object.keys(secrets).length} 个 Worker secret（值不会打印）`);
          JS
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
