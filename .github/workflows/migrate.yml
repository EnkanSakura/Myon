name: Database Migrate

# 生产 D1 迁移：push main 或手动触发；成功后由 Deploy workflow 继续部署。
# 迁移必须先于新 Worker 生效（例如新增列、删表），所以触发链是：
# push main → Database Migrate → Deploy → Smoke Test。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: d1-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check required secrets
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::缺少 GitHub Secret CLOUDFLARE_D1_DATABASE_ID（Cloudflare D1 的 database_id）。请到仓库 Settings → Secrets and variables → Actions → Secrets 配置后重新运行。"
            exit 1
          fi
      - name: Generate wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENVIRONMENT: production
        run: pnpm wrangler:config
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply myon-blog --remote
