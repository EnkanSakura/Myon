name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler config
        run: pnpm wrangler:config
      - name: Biome
        run: pnpm lint
      - name: Astro check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Worker bundle check
        run: pnpm deploy:dry

  e2e:
    name: Playwright
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate wrangler config
        run: pnpm wrangler:config
      - name: Prepare local env
        run: |
          printf 'ENVIRONMENT=development\nADMIN_TOKEN=ci-admin-token\n' > apps/web/.dev.vars
          echo "ADMIN_TOKEN=ci-admin-token" >> "$GITHUB_ENV"
      - name: Prepare local D1
        run: pnpm db:migrate:local && pnpm db:seed:local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
