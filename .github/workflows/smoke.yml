name: Smoke Test

# 部署后的健康检查：Deploy 成功完成后触发，先等待 3 分钟让 Worker 版本与
# Cloudflare 边缘缓存稳定，再请求 /api/health。也可以手动触发。
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: /api/health
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait 3 minutes for rollout
        run: |
          echo '· 等待 3 分钟，让新 Worker 版本在边缘完全生效…'
          sleep 180
      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if: ${{ vars.PRODUCTION_URL != '' }}
          run: curl --fail --silent --show-error --max-time 15 "${{ vars.PRODUCTION_URL }}/api/health"
